name: daycare_management_system_mobile
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.12.0


dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  #State management
  get: ^4.3.3
  get_storage: ^2.0.3

  #animations, fonts, shimmer and svg
  simple_animations: ^5.0.2
  smooth_page_indicator: ^1.0.1
  animated_splash_screen: ^1.3.0
  google_fonts: ^6.2.1
  flutter_animate: any
  shimmer: ^3.0.0
  url_launcher: ^6.2.5
  go_router: ^11.0.0
  pinput: ^5.0.1

  image_picker: ^1.1.2


  rive: ^0.13.4
  flutter_screenutil: ^5.9.3

  curved_navigation_bar: ^1.0.3



flutter:
  uses-material-design: true

  assets:
    - assets/images/


